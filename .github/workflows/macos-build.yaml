name: macOS Interactive SSH Build
on: workflow_dispatch

jobs:
  interactive-ssh:
    runs-on: macos-14 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0' 

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore

      - name: Configure SSH Key and Run
        env:
          MY_PASSPHRASE: ${{ secrets.MY_PASSPHRASE }}
          # 1. Pass your raw SSH private key string from a GitHub Secret
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }} 
        run: |
          # 2. Create the secure .ssh directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 3. Write the key to the exact path the app expects
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/ramdisk_ecdsa
          chmod 600 ~/.ssh/ramdisk_ecdsa

      - name: Run script with Secret
        env:
          MY_PASSPHRASE: ${{ secrets.MY_PASSPHRASE }}
        run: dotnet run 
