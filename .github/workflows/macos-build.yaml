name: macOS Interactive SSH Build
on: workflow_dispatch # Allows you to manually trigger it with a button click

jobs:
  interactive-ssh:
    runs-on: macos-14 # This ensures a cloud runner with macOS Sonoma and Xcode 16+
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Open Interactive SSH Tunnel
        uses: mxschmitt/action-tmate@v3 # Opens an active SSH socket
