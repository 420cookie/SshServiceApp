name: macOS Interactive SSH Build
on: workflow_dispatch

jobs:
  interactive-ssh:
    runs-on: macos-14 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0' 

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore
        
      # Step 1: Set up keys and start the native SSH daemon
      - name: Configure SSH Key and Environment
        env:
          MY_PASSPHRASE: ${{ secrets.MY_PASSPHRASE }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }} 
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/ramdisk_ecdsa
          chmod 600 ~/.ssh/ramdisk_ecdsa
          sudo dscl . -append /Groups/com.apple.access_ssh GroupMembership runner
          sudo dscl . -append /Groups/com.apple.access_ssh GroupMembership administrators
          sudo systemsetup -setremotelogin off
          sudo systemsetup -setremotelogin on

      # Step 2: Launch the interactive tmate breakpoint wrapper
      - name: Setup Interactive SSH Session (tmate)
        uses: mxschmitt/action-tmate@v3

      # Step 3: Run your project (Executed once you disconnect or resume)
      - name: Run script with Secret
        env:
          MY_PASSPHRASE: ${{ secrets.MY_PASSPHRASE }}
        run: dotnet run

